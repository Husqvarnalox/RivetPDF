# Rivet CI: portable foundation (PDFium-OFF).
#
# The build-test / windows-msvc jobs below are the PDFium-independent
# foundation (configure, build, ctest, zero warnings). The linux-pdfium and
# windows-msvc-pdfium jobs at the end build PDFium from the pinned recipe in
# tools/pdfium/ (cached) and run the PDFium-ON suite. Rivet's own CMake never
# downloads PDFium.
#
# The Ubuntu job is deliberately a GCC portability build (CMake's default
# /usr/bin/c++ is g++ on the runner): it validates the headers and sources
# against GCC/libstdc++, whose standard library does NOT provide the
# transitive includes Apple's libc++ does (this is what caught
# std::uint8_t-without-<cstdint> in src/core/Log.hpp). The macOS job
# validates the AppleClang/libc++ path the product actually ships with; a
# second macOS job builds a universal (arm64 + x86_64) binary so x86_64-only
# breakage is caught on Apple Silicon runners. The Windows job builds the
# portable libraries, the tests and the Win32/Direct2D shell with MSVC.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest   # GCC portability build (/usr/bin/c++ = g++)
            name: linux-gcc
            cmake_args: -DRIVET_ENABLE_NETWORK=ON
          - os: macos-latest    # AppleClang product build (system libcurl)
            name: macos
            cmake_args: -DRIVET_ENABLE_NETWORK=ON
          - os: macos-latest    # universal binary: arm64 + x86_64 slices
            name: macos-universal
            cmake_args: -DCMAKE_OSX_ARCHITECTURES=arm64;x86_64
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # The X11 desktop shell (src/platform/linux) is built whenever these
      # development packages are present, so the Ubuntu job compiles it with
      # -Werror on GCC.
      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config \
            libx11-dev libcairo2-dev libfreetype-dev libharfbuzz-dev \
            libfontconfig-dev libpng-dev libjpeg-dev libcups2-dev \
            libcurl4-openssl-dev

      - name: Configure (PDFium OFF, warnings visible)
        run: |
          cmake -S . -B build -G Ninja \
                -DCMAKE_BUILD_TYPE=RelWithDebInfo \
                -DCMAKE_CXX_FLAGS="-Werror" \
                -DRIVET_BUILD_TESTS=ON \
                "${{ matrix.cmake_args }}"

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # Windows: MSVC (x64) through Ninja, PDFium OFF, warnings as errors.
  windows-msvc:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
          # Windows on ARM64 (MSVC arm64). Enable once the repository has
          # access to the hosted ARM64 Windows runners:
          # - os: windows-11-arm
          #   arch: arm64
    name: windows-msvc-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Ensure Ninja
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y --no-progress }

      - name: Configure (PDFium OFF, warnings as errors)
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja `
                -DCMAKE_BUILD_TYPE=RelWithDebInfo `
                -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl `
                -DCMAKE_COMPILE_WARNING_AS_ERROR=ON `
                -DRIVET_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build -- -k 0  # report every MSVC error in one run

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # PDFium-ON jobs (Phase 8 / ADR-0036). PDFium is built by the pinned scripts
  # in tools/pdfium/ (revision + GN args are checked in) and cached under a key
  # derived from every file in that directory, so a revision/args/script change
  # rebuilds it and nothing else does. A cold build takes tens of minutes; warm
  # runs only restore the install tree. Rivet's own CMake never downloads it.
  linux-pdfium:
    name: linux-pdfium
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      PDFIUM_ROOT: ${{ github.workspace }}/pdfium-install
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config g++ python3 \
            libx11-dev libcairo2-dev libfreetype-dev libharfbuzz-dev \
            libfontconfig-dev libpng-dev libjpeg-dev libcups2-dev

      - name: Restore PDFium
        id: pdfium-cache
        uses: actions/cache/restore@v4
        with:
          path: pdfium-install
          key: pdfium-linux-x64-${{ hashFiles('tools/pdfium/**') }}

      - name: Build PDFium (cache miss)
        if: steps.pdfium-cache.outputs.cache-hit != 'true'
        run: tools/pdfium/build-pdfium.sh --arch x64 --install "$PDFIUM_ROOT" --work "$RUNNER_TEMP/pdfium-work"

      - name: Save PDFium
        if: steps.pdfium-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: pdfium-install
          key: pdfium-linux-x64-${{ hashFiles('tools/pdfium/**') }}

      - name: Configure (PDFium ON, GCC, warnings as errors)
        run: |
          cmake -S . -B build -G Ninja \
                -DCMAKE_BUILD_TYPE=RelWithDebInfo \
                -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ \
                -DCMAKE_CXX_FLAGS="-Werror" \
                -DRIVET_BUILD_TESTS=ON \
                -DRIVET_WITH_PDFIUM=ON \
                -DRIVET_PDFIUM_ROOT="$PDFIUM_ROOT"

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Smoke (open, render page 1, save copy)
        run: build/tests/pdf/rivet-smoke-open

  windows-msvc-pdfium:
    name: windows-msvc-pdfium
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      PDFIUM_ROOT: ${{ github.workspace }}\pdfium-install
    steps:
      - uses: actions/checkout@v4

      - name: MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Ensure Ninja
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y --no-progress }

      - name: Restore PDFium
        id: pdfium-cache
        uses: actions/cache/restore@v4
        with:
          path: pdfium-install
          key: pdfium-windows-x64-${{ hashFiles('tools/pdfium/**') }}

      - name: Build PDFium (cache miss)
        if: steps.pdfium-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: tools/pdfium/build-pdfium.ps1 -Arch x64 -Install "$env:PDFIUM_ROOT" -Work "$env:RUNNER_TEMP\pdfium-work"

      - name: Save PDFium
        if: steps.pdfium-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: pdfium-install
          key: pdfium-windows-x64-${{ hashFiles('tools/pdfium/**') }}

      - name: Configure (PDFium ON, MSVC, warnings as errors)
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja `
                -DCMAKE_BUILD_TYPE=RelWithDebInfo `
                -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl `
                -DCMAKE_COMPILE_WARNING_AS_ERROR=ON `
                -DRIVET_BUILD_TESTS=ON `
                -DRIVET_WITH_PDFIUM=ON `
                -DRIVET_PDFIUM_ROOT="$env:PDFIUM_ROOT"

      - name: Build
        run: cmake --build build -- -k 0  # report every MSVC/link error in one run

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Smoke (open, render page 1, save copy)
        run: build\tests\pdf\rivet-smoke-open.exe
